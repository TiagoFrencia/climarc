services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: climarc-backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DATABASE_PATH=/app/data/climarc.db
      - WRF_JSON_URL=${WRF_JSON_URL:-/app/data/wrf_latest.json}
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: climarc-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
