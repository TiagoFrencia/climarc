services:
  - type: web
    name: climarc-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/ping
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: ADMIN_PIN
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: WRF_JSON_URL
        sync: false
      - key: DATABASE_PATH
        value: /app/data/climarc.db
      - key: PYTHONUNBUFFERED
        value: "1"
